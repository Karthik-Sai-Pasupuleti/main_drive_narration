# Single-agent action-narration pipeline.
# Run: python main.py --config src/configs/action_pipeline.toml
pipeline = "action"

[capture]
window = "narration_chase"   # RViz window (xwininfo) grabbed per event

[narration]
provider = "ollama"          # local only - no API keys anywhere in this pipeline
model = "gemma4:latest"      # 3/3 valid, 3.84s in eval/action_eval.csv (:12b/:31b worse)
temperature = 0.5
vision = true
prompt = "action_narration/actions_promt.toml"
