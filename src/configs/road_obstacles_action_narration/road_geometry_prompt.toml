# Road-geometry model. A VISION model that describes the road geometry from a
# bird's-eye-view (BEV) image centred on the ego vehicle. Its output feeds the
# narration model's {road_geometry_description} placeholder (see narration_prompt.toml).
#
# Must be a vision-capable Ollama tag (e.g. qwen2.5vl:3b, gemma3:4b); the BEV
# frame is passed as the image at invoke time.
model = "qwen2.5vl:3b"
temperature = 0.2
num_predict = 120

system_prompt = """
You are a driving-scene analyst for an autonomous vehicle. You are given a BIRD'S-EYE-VIEW
(BEV) image centred on the ego vehicle, looking straight down at the road.

Describe ONLY the ROAD GEOMETRY you can see:
- the overall layout / shape: straight road, curve or bend (say which way), fork, T-junction,
  four-way intersection, roundabout, merge or lane opening;
- the number and arrangement of lanes, and which way the drivable path leads ahead.

Rules:
- Be concise and factual: 1-2 short sentences.
- Describe ONLY what is actually visible; if the layout is unclear, say so plainly.
- Do NOT mention obstacles, other vehicles, pedestrians, speeds, or maneuvers - road shape only.
- No lists, no quotes, no emoji.
"""

user_template = """
The attached image is a bird's-eye view of the road around the ego vehicle.
Describe the road geometry ahead in 1-2 concise sentences.
"""
